name: kimi-k3-qsrt-lmcache

services:
  kimik3:
    image: ${KIMI_IMAGE:-voipmonitor/vllm:infernal-invocation-vllm7ed814e-b12x5d648d9-fi1ac6942-cu133-torch213-20260813-r7}
    container_name: kimik3
    entrypoint: ["/usr/local/bin/serve-kimi-k3-qsrt.sh"]
    command:
      - --language-model-only
      - --decode-context-parallel-size
      - "8"
      - --dcp-comm-backend
      - a2a
      - --dcp-kv-cache-interleave-size
      - "1"
      - --no-enable-flashinfer-autotune
    network_mode: host
    ipc: host
    privileged: true
    init: true
    shm_size: 32gb
    gpus: all
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576
      stack: 67108864

    environment:
      # The supplied image/SM 12.0 combination uses its supported default
      # prefill path. Do not add the rejected FLASHINFER MLA prefill override.
      VLLM_ENABLE_PCIE_ALLREDUCE: "0"
      VLLM_USE_B12X_FP8_GEMM: "1"
      VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: "134217728"
      K3_PYTHON_BIN: /opt/venv/bin/python
      K3_MODEL_DIR: /model
      K3_SERVED_MODEL_NAME: ${K3_SERVED_MODEL_NAME:-Kimi-K3}
      K3_HOST: 0.0.0.0
      K3_PORT: "8090"
      K3_TP_SIZE: "8"
      K3_MAX_MODEL_LEN: ${K3_MAX_MODEL_LEN:-200000}
      K3_GPU_MEMORY_UTILIZATION: ${K3_GPU_MEMORY_UTILIZATION:-0.9765}
      # Explicit per-rank active KV reservation (576 MiB). Re-budget this for
      # another graph/model/concurrency profile instead of changing it blindly.
      K3_KV_CACHE_MEMORY_BYTES: ${K3_KV_CACHE_MEMORY_BYTES:-603979776}
      K3_MAX_NUM_BATCHED_TOKENS: ${K3_MAX_NUM_BATCHED_TOKENS:-1536}
      K3_MAX_NUM_SEQS: ${K3_MAX_NUM_SEQS:-2}
      K3_COMPILATION_CONFIG: '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2],"custom_ops":["all"]}'
      K3_ENABLE_DSPARK: "0"
      K3_NUM_SPECULATIVE_TOKENS: "0"
      K3_DSPARK_ATTENTION_BACKEND: B12X_MLA
      K3_MAMBA_CACHE_MODE: align

      # LMCache MP: host-RAM L1 + persistent fs_native/O_DIRECT L2.
      K3_ENABLE_LMCACHE: "1"
      # 1536 rank-local scheduler tokens × 8 DCP KV shards = 12288.
      K3_LMCACHE_CHUNK_SIZE: ${K3_LMCACHE_CHUNK_SIZE:-12288}
      K3_LMCACHE_L1_GB: ${K3_LMCACHE_L1_GB:-48}
      K3_LMCACHE_L1_INIT_GB: ${K3_LMCACHE_L1_INIT_GB:-48}
      K3_LMCACHE_L2_GB: ${K3_LMCACHE_L2_GB:-1200}
      K3_LMCACHE_DISK_PATH: /lmcache/l2
      K3_LMCACHE_SERVER_ENV: "CUDA_MODULE_LOADING=LAZY LMCACHE_MP_GPU_STAGING_BATCH_SIZE=1"
      K3_LMCACHE_PREFETCH_POLICY: default
      K3_LMCACHE_PREFETCH_MAX_INFLIGHT: "8"

      # Leave empty for local checkpoints that require no Hub access.
      HF_TOKEN: ${HF_TOKEN:-}

    volumes:
      - "${MODEL_PATH:?Set MODEL_PATH in .env}:/model:ro"
      - "${KIMI_CACHE_PATH:?Set KIMI_CACHE_PATH in .env}:/cache"
      - "${KIMI_TMP_PATH:?Set KIMI_TMP_PATH in .env}:/container-tmp"
      - "${LMCACHE_L2_PATH:?Set LMCACHE_L2_PATH in .env}:/lmcache/l2"
      - "${LMCACHE_TMP_PATH:?Set LMCACHE_TMP_PATH in .env}:/lmcache/tmp"

      # Immutable, reviewable source overlays. The image is not modified.
      - ./patchwork/serve-kimi-k3-qsrt-lmcache.sh:/usr/local/bin/serve-kimi-k3-qsrt.sh:ro
      - ./patchwork/lmcache/integration/vllm/kv_cache_group_edits.py:/opt/venv/lib/python3.12/site-packages/lmcache/integration/vllm/kv_cache_group_edits.py:ro
      - ./patchwork/lmcache/integration/vllm/lmcache_mp_connector.py:/opt/venv/lib/python3.12/site-packages/lmcache/integration/vllm/lmcache_mp_connector.py:ro
      - ./patchwork/lmcache/v1/gpu_connector/utils.py:/opt/venv/lib/python3.12/site-packages/lmcache/v1/gpu_connector/utils.py:ro
      - ./patchwork/lmcache/v1/platform/cuda/cache_context.py:/opt/venv/lib/python3.12/site-packages/lmcache/v1/platform/cuda/cache_context.py:ro
      - ./patchwork/vllm/v1/attention/backends/mla/b12x_mla.py:/opt/infernal-invocation/vllm/vllm/v1/attention/backends/mla/b12x_mla.py:ro
